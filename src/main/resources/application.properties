spring.application.name=Hunger_Connect

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── DataSource ───────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hunger_connect}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ─── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:change-me-in-prod-use-at-least-512-bit-secret-key-here-please}
app.jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY:900000}
app.jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY:604800000}

# ─── S3 / MinIO ───────────────────────────────────────────────────────────────
app.storage.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.storage.access-key=${S3_ACCESS_KEY:minioadmin}
app.storage.secret-key=${S3_SECRET_KEY:minioadmin}
app.storage.bucket=${S3_BUCKET:hunger-connect}
app.storage.region=${S3_REGION:us-east-1}
app.storage.max-file-size-mb=${S3_MAX_FILE_MB:5}

# ─── Mail ─────────────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${MAIL_PASSWORD:re_placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
app.mail.from=${MAIL_FROM:noreply@hungerconnect.app}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ─── File Upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.noHunger=DEBUG
logging.level.org.springframework.security=INFO
